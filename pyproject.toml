[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelle-credit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic", "pyyaml", "httpx"]

[tool.setuptools.packages.find]
include = ["mcp_donnees*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]